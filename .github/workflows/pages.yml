name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs
            tools/content-studio/studio-static
      # The baked static studio (build_static.ps1) is gitignored by default;
      # when a maintainer commits it under tools/content-studio/studio-static,
      # publish it at /studio/ alongside the landing page. A committed
      # docs/studio/ wins (never overwritten) if a maintainer copied the bake
      # there instead.
      - name: Prepare site
        shell: bash
        run: |
          if [ -d tools/content-studio/studio-static ] && [ ! -d docs/studio ]; then
            mkdir -p docs/studio
            cp -r tools/content-studio/studio-static/. docs/studio/
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
